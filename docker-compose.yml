services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chahed
      POSTGRES_PASSWORD: chahed_dev_only
      POSTGRES_DB: chahed
    ports:
      - "${CHAHED_DB_PORT:-5432}:5432"
    volumes:
      - chahed_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chahed -d chahed"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://chahed:chahed_dev_only@db:5432/chahed
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev python -m app.rules.load_rules &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./web
    env_file: ./web/.env
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  chahed_db:
