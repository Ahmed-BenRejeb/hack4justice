[project]
name = "chahed-api"
version = "0.1.0"
description = "Chahed backend: extraction, corpus retrieval, rules, counterparty checks, TEJ export"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "lxml>=6.1.3",
    "pdf2image>=1.17.0",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.5",
    "pypdf>=6.18.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.52",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
extend-exclude = ["migrations/versions", "migrations/env.py"]

[tool.ruff.lint]
# B008: FastAPI's dependency injection relies on Depends(...) as a default argument.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
