name: Deploy to production

# Runs on the demo EC2 instance itself (see docs/deploy.md section 6): the
# security group only allows SSH from the admin's own IP (deploy/terraform,
# D-051), so a GitHub-hosted runner has no way in. A self-hosted runner
# avoids opening that up and needs no SSH key or AWS credential in GitHub
# at all (D-061).

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, chahed-demo]
    steps:
      - uses: actions/checkout@v4

      - name: Restore api/.env and web/.env
        run: |
          cp /opt/chahed/env/api.env api/.env
          cp /opt/chahed/env/web.env web/.env

      - name: Require SITE_ADDRESS
        run: |
          if [ -z "${{ vars.SITE_ADDRESS }}" ]; then
            echo "::error::Repository variable SITE_ADDRESS is not set (Settings > Secrets and variables > Actions > Variables). See docs/deploy.md section 7." >&2
            exit 1
          fi

      - name: Deploy stack
        env:
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: docker compose -f deploy/docker-compose.prod.yml up -d --build

      - name: Smoke test
        env:
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
        run: |
          # `up -d` returns once containers start, not once api has run
          # migrations, loaded rules/corpus and uvicorn is serving; only
          # db has a healthcheck in docker-compose.prod.yml. Poll instead
          # of checking once.
          for i in $(seq 1 30); do
            if curl -sf "https://${SITE_ADDRESS}/api/v1/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "api never became healthy after 5 minutes" >&2
          exit 1
