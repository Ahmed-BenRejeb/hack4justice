# Production overlay for the one-day demo deploy (docs/deploy.md).
#
# Self-contained rather than merged with the root docker-compose.yml:
# compose concatenates (rather than replaces) list-valued keys like `ports`
# across -f files, so the only reliable way to stop db/api/web from
# publishing host ports is a standalone file. Run from the repo root:
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Only Caddy is reachable from outside the instance; db, api and web talk
# to each other over the compose network only.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chahed
      POSTGRES_PASSWORD: chahed_dev_only
      POSTGRES_DB: chahed
    volumes:
      - chahed_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chahed -d chahed"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    env_file: ../api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://chahed:chahed_dev_only@db:5432/chahed
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run --no-dev alembic upgrade head &&
             uv run --no-dev python -m app.rules.load_rules &&
             uv run --no-dev python -m app.corpus.load_corpus &&
             uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ../web
    env_file: ../web/.env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, e.g. export SITE_ADDRESS=$(terraform -chdir=deploy/terraform output -raw site_url | sed 's#https://##')}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  chahed_db:
  caddy_data:
  caddy_config:
